# 规划场景障碍物配置
# frame_id: 障碍物所在坐标系（launch 中可通过 frame_id 参数覆盖）
# objects: 障碍物列表
#   box 类型:  size = [长, 宽, 高]（不需要 STL 文件）
#   mesh 类型: resource 指向 STL 文件（需放入 meshes/ 目录，
#             建议使用 package://dobot_planning_scene/meshes/xxx.stl 写法）

frame_id: base_link

objects:
  - id: object_1
    type: box
    size: [4.0, 4.0, 0.01]
    position: [0.0, 0.0, -0.1]
    orientation: [0.0, 0.0, 0.0, 1.0]
